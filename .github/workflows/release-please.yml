# Release Please workflow
# Automates version bumping and changelog generation based on Conventional Commits
# https://github.com/googleapis/release-please-action

name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Manifest mode: uses release-please-config.json and .release-please-manifest.json

  # Build binaries in parallel across multiple runners
  build-binaries:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-4c
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go Build Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            ${{ runner.os }}-go-build-${{ matrix.goos }}-${{ matrix.goarch }}-
            ${{ runner.os }}-go-build-

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          COMMIT="${{ github.sha }}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          EXT=""
          if [ "$GOOS" = "windows" ]; then
            EXT=".exe"
          fi

          go build -trimpath -ldflags="-s -w \
            -X main.version=${VERSION} \
            -X main.commit=${COMMIT} \
            -X main.date=${DATE}" \
            -o kspec${EXT} \
            ./cmd/kspec

      - name: Create archive
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          GOOS="${{ matrix.goos }}"
          GOARCH="${{ matrix.goarch }}"

          # Determine archive name and type
          ARCH_NAME="${GOARCH}"
          if [ "$GOARCH" = "amd64" ]; then
            ARCH_NAME="x86_64"
          fi

          OS_NAME="$(echo $GOOS | sed 's/.*/\u&/')"  # Capitalize first letter
          ARCHIVE_NAME="kspec_${VERSION}_${OS_NAME}_${ARCH_NAME}"

          mkdir -p "${ARCHIVE_NAME}"

          # Copy common files
          cp LICENSE README.md "${ARCHIVE_NAME}/"
          mkdir -p "${ARCHIVE_NAME}/policies"
          cp policies/*.yml "${ARCHIVE_NAME}/policies/" 2>/dev/null || true
          cp policies/*.yaml "${ARCHIVE_NAME}/policies/" 2>/dev/null || true

          if [ "$GOOS" = "windows" ]; then
            cp kspec.exe "${ARCHIVE_NAME}/"
            zip -r "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"
            echo "ARCHIVE=${ARCHIVE_NAME}.zip" >> $GITHUB_ENV
          else
            cp kspec "${ARCHIVE_NAME}/"
            tar -czvf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
            echo "ARCHIVE=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.zip
          retention-days: 1

  # Create release with all artifacts
  create-release:
    needs: [release-please, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: archives
          pattern: archive-*
          merge-multiple: true

      - name: List downloaded files
        run: |
          echo "Contents of archives directory:"
          find archives -type f -name "*.tar.gz" -o -name "*.zip" | sort

      - name: Generate checksums
        run: |
          cd archives
          # Find all archive files and generate checksums
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec sha256sum {} \; | sed 's|./||' > checksums.txt
          cat checksums.txt

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: archives/sbom.spdx.json

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"

          # Upload all archive files, checksums, and SBOM
          find archives -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec gh release upload "${TAG}" {} --clobber \;
          gh release upload "${TAG}" archives/checksums.txt --clobber
          gh release upload "${TAG}" archives/sbom.spdx.json --clobber
