name: Runner Test

on:
  workflow_dispatch:

jobs:
  test-small:
    name: Test Small Runner
    runs-on: arc-runner-set
    timeout-minutes: 5
    steps:
      - run: |
          echo "Runner: $(hostname)"
          echo "Go: $(go version)"
          echo "Node: $(node --version)"
          echo "OS: $(uname -a)"
          echo "Success!"

  test-large:
    name: Test Large Runner
    runs-on: arc-runner-set-large
    timeout-minutes: 5
    steps:
      - run: |
          echo "Runner: $(hostname)"
          echo "Go: $(go version)"
          echo "Node: $(node --version)"
          echo "OS: $(uname -a)"
          echo "Success!"
