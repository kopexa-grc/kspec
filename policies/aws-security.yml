  - uid: aws-iam-password-policy
    title: Ensure IAM password policy enforces strong requirements
    resource: aws_iam_password_policy
    severity: medium
    query: |
      resource.minimum_password_length >= 14 &&
      resource.require_uppercase &&
      resource.require_lowercase &&
      resource.require_numbers &&
      resource.require_symbols &&
      resource.max_password_age <= 90 &&
      resource.password_reuse_prevention >= 24
    docs: |
      A strong password policy reduces the risk of compromised credentials through brute-force attacks.
    remediation: |
      Configure the IAM password policy to require minimum 14 characters, uppercase, lowercase, numbers, symbols, 90-day expiration, and prevent reuse of last 24 passwords.

  - uid: aws-iam-group-has-users
