    resource: aws_iam_policy
    severity: high
    query: |
      !resource.has_wildcard_actions && !resource.has_wildcard_resources
    docs: |
      Wildcard permissions violate the principle of least privilege and can grant excessive access.
    remediation: |
      Review IAM policies and replace wildcard permissions with specific actions and resources.

