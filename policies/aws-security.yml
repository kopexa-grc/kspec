  - uid: aws-iam-user-single-access-key
    title: Ensure IAM users have only one active access key
    resource: aws_iam_user
    severity: medium
    query: |
      resource.active_access_key_count <= 1
    docs: |
      Having multiple active access keys increases the attack surface and makes key rotation more complex.
    remediation: |
      Remove unused access keys and ensure each IAM user has only one active access key.

  - uid: aws-iam-no-wildcard-policies
