  - uid: aws-sagemaker-notebook-not-public
    title: Ensure SageMaker notebook instances are not directly accessible from internet
    resource: aws_sagemaker_notebook
    severity: critical
    query: |
      !resource.direct_internet_access
    docs: |
      Direct internet access to notebook instances increases the attack surface.
    remediation: |
      Disable direct internet access and use VPC with NAT gateway for internet connectivity.
